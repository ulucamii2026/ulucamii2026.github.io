    ad: Rıdvan Kayahan
    eposta: imam@ulucamii.be
    gorev:
      tr: Din Görevlisi (Diyanet İşleri Başkanlığı görevlendirmesi)
      fr: Imam (détaché par la Présidence des Affaires religieuses de Türkiye)
      en: Imam (appointed by the Turkish Presidency of Religious Affairs)
      nl: Imam (gedetacheerd door Diyanet, het Presidium voor Godsdienstzaken van Türkiye)
      de: Imam (entsandt von Diyanet, dem Präsidium für Religionsangelegenheiten der Türkei)
  personel:
    - ad: Abdulrahman Hallak
      foto: /media/kurul/abdulrahman-hallak.webp
      dogumYili: 1994
      memleket:
        tr: Halep (Suriye)
        fr: Alep (Syrie)
        en: Aleppo (Syria)
        nl: Aleppo (Syrië)
        de: Aleppo (Syrien)
      meslek:
        tr: Öğretmen
        fr: Enseignant
        en: Teacher
        nl: Leerkracht
        de: Lehrer
      ikamet: Saint-Hubert
      gorev:
        tr: Cami Personeli (Kafeterya ve İkram Hizmetleri)
        fr: Personnel de la mosquée (Responsable de la cafétéria)
        en: Mosque Staff (Cafeteria & Hospitality Services)
        nl: Moskeepersoneel (cafetaria en onthaal)
        de: Moscheepersonal (Cafeteria und Bewirtung)
      mesaj:
        tr: "Suriye'den kardeşiniz Abdulrahman, öğretmenim, Saint-Hubert'te ikamet ediyorum. Camimize hizmet etmekten onur duyuyorum. Allah bizleri iyilik ve takva üzere yardımlaşanlardan eylesin."
        fr: "Votre frère Abdulrahman, originaire de Syrie, enseignant, résidant à Saint-Hubert. C'est un honneur pour moi de servir notre mosquée. Qu'Allah fasse de nous des personnes qui s'entraident dans la bonté et la piété."
        en: "Your brother Abdulrahman, originally from Syria, teacher, residing in Saint-Hubert. It is an honor for me to serve our mosque. May Allah make us among those who cooperate in goodness and piety."
        nl: "Uw broeder Abdulrahman, afkomstig uit Syrië, leerkracht, woonachtig in Saint-Hubert. Het is een eer voor mij om onze moskee te mogen dienen. Moge Allah ons laten behoren tot hen die elkaar helpen in goedheid en godsvrucht."
        de: "Ihr Bruder Abdulrahman, aus Syrien stammend, Lehrer, wohnhaft in Saint-Hubert. Es ist mir eine Ehre, unserer Moschee zu dienen. Möge Allah uns zu denen gehören lassen, die einander in Güte und Gottesfurcht beistehen."
  not:
    tr: "9 Ocak 2026 Genel Kurulu'nda seçilen ve 2026 yılı içinde güncellenen yönetim kuruludur. (Son güncelleme: 17 Eylül 2026)"
    fr: "Conseil d'administration élu lors de l'Assemblée générale du 9 janvier 2026 et actualisé en 2026. (Dernière mise à jour : 17 septembre 2026)"
    en: "Board elected at the General Assembly of 9 January 2026 and updated during 2026. (Last updated: 17 September 2026)"
    nl: "Bestuur verkozen op de algemene vergadering van 9 januari 2026 en in de loop van 2026 geactualiseerd. (Laatste bijwerking: 17 september 2026)"
    de: "Vorstand, gewählt in der Generalversammlung vom 9. Januar 2026 und im Laufe des Jahres 2026 aktualisiert. (Letzte Aktualisierung: 17. September 2026)"
