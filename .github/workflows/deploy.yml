name: Siteyi yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *"   # her gün 03:30 UTC — "bugün" esaslı listeler (vakit tablosu, haftalık program, irşat) tazelenir
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v7
      - name: Astro ile derle ve yükle
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5

  # Yayin zinciri sessizce kirilmasin: build ya da deploy dustugunde haber gelir
  # (namaz vakitleri isinde uyari vardi, burada yoktu — 25 Agustos 2026 denetimi).
  uyari:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Başarısızsa uyarı e-postası (info@ulucamii.be)
        env:
          SMTP_SIFRE: ${{ secrets.SMTP_SIFRE }}
        run: |
          {
            echo "From: Ulu Camii Site Denetimi <info@ulucamii.be>"
            echo "To: info@ulucamii.be"
            echo "Subject: [UYARI] Site yayini basarisiz"
            echo "Content-Type: text/plain; charset=utf-8"
            echo
            echo "Sitenin yayin zinciri (build ya da GitHub Pages deploy) basarisiz oldu."
            echo "Canlidaki surum DEGISMEDI; son basarili yayin ayakta kalmaya devam ediyor."
            echo "Yeni icerik ve duzeltmeler siteye cikmaz; kayit sayfasi da guncellenmez."
            echo
            echo "Kayit: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/uyari.txt
          curl -s --url "smtps://smtp.purelymail.com:465" --ssl-reqd \
            --mail-from "info@ulucamii.be" --mail-rcpt "info@ulucamii.be" \
            --user "info@ulucamii.be:$SMTP_SIFRE" --upload-file /tmp/uyari.txt
