name: Namaz vakitlerini güncelle (Diyanet)

on:
  schedule:
    # Gunde iki kez. Birincil kaynak Diyanet'in resmi sayfasi (namazvakitleri.diyanet.gov.tr,
    # Actions'tan erisilebilir); yedek kaynak ayna (ezanvakti.emushaf.net, Actions'tan 403).
    - cron: "47 2 * * *"    # 02:47 UTC — veri degistiyse commit (gunluk yayin deploy.yml zamanlayicisinda)
    - cron: "23 11 * * *"   # 11:23 UTC — sabahki cekim basarisizsa ikinci sans
  push:
    paths:
      - scripts/namaz-vakitleri.mjs          # betik degisince hemen bir cekim yap (sinama)
      - .github/workflows/namaz-vakitleri.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Diyanet verisini çek
        id: cek
        run: node scripts/namaz-vakitleri.mjs
      # KALICI KURAL: vakitler yalnız Diyanet'ten gelir. Çekim başarısızsa mevcut (doğru) veri korunur
      # ve yerine hesaplama tabanlı bir kaynak KONULMAZ; bunun yerine görevli uyarılır.
      - name: Başarısızsa uyarı e-postası (info@ulucamii.be)
        if: failure() && steps.cek.outcome == 'failure'
        env:
          SMTP_SIFRE: ${{ secrets.SMTP_SIFRE }}
          KALAN: ${{ steps.cek.outputs.kalan_gun }}
        run: |
          # Konu, kalan omre gore siddetleniyor: her gun ayni basligi gormek
          # alarmi korlestiriyor - asil kritik gun ayirt edilebilmeli.
          if [ -z "$KALAN" ]; then
            KONU="[UYARI] Namaz vakitleri alinamadi - eldeki verinin omru okunamadi"
          elif [ "$KALAN" -le 10 ]; then
            KONU="[ACIL] Namaz vakitleri alinamadi - veri $KALAN gun sonra bitiyor"
          else
            KONU="[UYARI] Namaz vakitleri alinamadi - veri $KALAN gun daha yetiyor"
          fi
          {
            echo "From: Ulu Camii Site Denetimi <info@ulucamii.be>"
            echo "To: info@ulucamii.be"
            echo "Subject: $KONU"
            echo "Content-Type: text/plain; charset=utf-8"
            echo
            echo "Diyanet namaz vakitleri cekimi bugun HER IKI kaynaktan da basarisiz oldu (ilce 11890 - M.FAMENNE):"
            echo "  1) resmi sayfa namazvakitleri.diyanet.gov.tr  2) ayna ezanvakti.emushaf.net"
            echo "Sitedeki mevcut Diyanet verisi KORUNDU; yanlis/hesaplanmis vakit yayimlanmadi."
            echo "Eldeki kesintisiz veri: ${KALAN:-bilinmiyor} gun."
            echo
            echo "Yapilacak: bu is bir gun sonra kendiliginden yeniden dener. Ust uste basarisizsa"
            echo "depo klasorunde su komut yeterlidir (Belcika'dan ayna calisir):"
            echo "  node scripts/namaz-vakitleri.mjs && git add -A && git commit -m veri && git push"
            echo "Resmi sayfanin yapisi degistiyse scripts/namaz-vakitleri.mjs icindeki ayristirici guncellenir."
            echo
            echo "Kayit: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/uyari.txt
          curl -s --url "smtps://smtp.purelymail.com:465" --ssl-reqd             --mail-from "info@ulucamii.be" --mail-rcpt "info@ulucamii.be"             --user "info@ulucamii.be:$SMTP_SIFRE" --upload-file /tmp/uyari.txt
      - name: Değişiklik varsa commit et
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src/data/namaz-vakitleri.json; then
            git add src/data/namaz-vakitleri.json
            git commit -m "veri: namaz vakitleri güncellendi ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash origin main
            git push
            echo "degisti=true" >> "$GITHUB_OUTPUT"
          else
            echo "Değişiklik yok"
            echo "degisti=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Yayını tetikle (GITHUB_TOKEN push'u deploy'u otomatik başlatmaz)
        if: steps.commit.outputs.degisti == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
